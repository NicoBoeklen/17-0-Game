name: Daily NFL Data Sync (24h)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-nfl-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live NFL stats & calibrate OL trench rankings
        run: |
          python backend/sync_live_nfl.py
          python backend/calibrate_data.py

      - name: Commit updated NFL data (triggers Vercel redeploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/nfl_live_data.json
          if git diff --staged --quiet; then
            echo "No changes in NFL data."
          else
            git commit -m "chore(data): daily NFL 2026/27 stats & OL trench ranking sync"
            git push
          fi
